<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="none" />
  </defs>

  <!-- Kernel box -->
  <rect x="380" y="220" width="320" height="140" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="540" y="300" text-anchor="middle" dominant-baseline="middle" font-size="28" fill="#000">The Kernel</text>

  <!-- Left block arrow: Design alternatives -->
  <polygon points="220,275 310,275 310,265 370,290 310,315 310,305 220,305" fill="#999999" stroke="#666666" stroke-width="1"/>
  <text x="210" y="285" text-anchor="end" font-size="18" fill="#0000FF">Design alternatives</text>
  <text x="295" y="337" text-anchor="middle" font-size="13" font-style="italic" fill="#666666">monolithic vs microkernel</text>

  <!-- Right block arrow: Goals of the system -->
  <polygon points="880,275 790,275 790,265 730,290 790,315 790,305 880,305" fill="#999999" stroke="#666666" stroke-width="1"/>
  <text x="890" y="285" text-anchor="start" font-size="18" fill="#0000FF">Goals of the system</text>
  <text x="805" y="337" text-anchor="middle" font-size="13" font-style="italic" fill="#666666">portability, security, performance, reliability,</text>
  <text x="805" y="357" text-anchor="middle" font-size="13" font-style="italic" fill="#666666">realtime response time</text>

  <!-- Top block arrows: Services to upper layers -->
  <line x1="400" y1="100" x2="680" y2="100" stroke="#666666" stroke-width="2"/>
  <polygon points="452,215 452,145 442,145 465,105 488,145 478,145 478,215" fill="#999999" stroke="#666666" stroke-width="1"/>
  <polygon points="602,215 602,145 592,145 615,105 638,145 628,145 628,215" fill="#999999" stroke="#666666" stroke-width="1"/>
  <text x="540" y="80" text-anchor="middle" font-size="18" fill="#FF0000">Services to upper layers</text>
  <text x="540" y="95" text-anchor="middle" font-size="13" font-style="italic" fill="#666666">system calls (syscalls)</text>

  <!-- User mode / supervisor mode boundary -->
  <line x1="140" y1="217" x2="960" y2="217" stroke="#B85450" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="150" y="210" font-size="13" font-style="italic" font-weight="bold" fill="#B85450">user mode</text>
  <text x="150" y="234" font-size="13" font-style="italic" font-weight="bold" fill="#B85450">supervisor mode</text>

  <!-- Bottom block arrows: Hardware devices -->
  <line x1="400" y1="600" x2="680" y2="600" stroke="#666666" stroke-width="2"/>
  <polygon points="452,575 452,505 442,505 465,465 488,505 478,505 478,575" fill="#999999" stroke="#666666" stroke-width="1"/>
  <polygon points="602,575 602,505 592,505 615,465 638,505 628,505 628,575" fill="#999999" stroke="#666666" stroke-width="1"/>
  <text x="540" y="630" text-anchor="middle" font-size="18" fill="#FF0000">Hardware devices</text>
  <text x="540" y="648" text-anchor="middle" font-size="13" font-style="italic" fill="#666666">interrupts, DMA, IO</text>
</svg>
